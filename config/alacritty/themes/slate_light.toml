# Slate Light -- real values from devs-themes/palettes/slate.json
# (the app's own house "stone" look). red/yellow/blue/cyan below are
# derived fill (interpolated toward fg from bg), not verified brand
# colors.

[colors.primary]
background = '#d0cbbf'
foreground = '#13120f'

[colors.cursor]
text = '#d0cbbf'
cursor = '#33762d'

[colors.normal]
black   = '#d0cbbf'
red     = '#7a4a3a'
green   = '#33762d'
yellow  = '#7a6a3a'
blue    = '#7fa8cc'  # dircolors folder-contrast fix: WSL renders
                     # other-writable dirs (every /mnt/c folder) as
                     # normal.blue text ON normal.green bg (`ow=34;42`).
                     # A darker mid-tone blue-on-green here is unreadable
                     # (two similarly-dark mid-tones); lightened to a
                     # clear stone-blue for real contrast against the
                     # green fill.
magenta = '#5a3a7a'
cyan    = '#3a7a72'
white   = '#322f28'

[colors.bright]
black   = '#a89f8c'  # a real, clearly separated step off bg #d0cbbf
                     # (tmux's inactive-tab-bg/inactive-pane-border need
                     # real distinction from the base background), same
                     # warm stone-grey family.
green   = '#33762d'
red     = '#946355'
yellow  = '#948355'
blue    = '#557394'
magenta = '#755594'
cyan    = '#559489'
white   = '#13120f'
