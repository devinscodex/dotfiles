# Slate Dark -- real values from devs-themes/palettes/slate.json (a
# desaturated Solarized dark base, house moss accent replacing
# Solarized's original blue). Derived-fill convention as
# slate_light.toml. bg/colour8 is the retired Cobalt Dark (Bluish)
# family's own real blue-grey adopted outright (not blended toward it),
# for genuinely gray character rather than a Solarized-tinted approximation.
# Rest of the ANSI ramp (accents) untouched, this is a background-
# character shift, not a re-hue.

[colors.primary]
background = '#2c3640'  # Cobalt Dark's/Bluish's own real value,
                        # verbatim, not pure Solarized Osaka near-black-
                        # teal (#001a1d). HSL ~18% saturation, genuinely
                        # gray, comparable lightness to One Dark/Dracula
                        # so it still reads as a real "dark" theme bg.
foreground = '#839496'

[colors.cursor]
text = '#2c3640'
cursor = '#699d43'

[colors.normal]
black   = '#2c3640'
red     = '#a35a4a'
green   = '#699d43'
yellow  = '#a3924a'
blue    = '#4a72a3'
magenta = '#7a4aa3'
cyan    = '#4aa39a'
white   = '#657b83'

[colors.bright]
black   = '#414f5a'  # next visible step up from bg #2c3640, same
                     # desaturated blue-gray family (~21-26/255 gap,
                     # real separation), not Solarized's original base02
                     # (#073642).
red     = '#c27a6a'
green   = '#699d43'
yellow  = '#c2b26a'
blue    = '#6a92c2'
magenta = '#9a6ac2'
cyan    = '#6ac2b9'
white   = '#839496'
