# Inferno theme
# Source https//github.com/hafiz-muhammad/inferno-alacritty-theme

# Default colors
[colors.primary]
background = '#270d06'
foreground = '#d9d9d9'

# Normal colors
[colors.normal]
black   = '#270d06'  # was #330000 (close, but tightened to exactly match primary.background)
red     = '#ff3300'
green   = '#ff6600'
yellow  = '#ff9900'
blue    = '#ffcc00'
magenta = '#ff6600'
cyan    = '#ff9900'
white   = '#d9d9d9'

# Bright colors
[colors.bright]
black   = '#4d2005'  # was #663300 (moderately bright warm brown for a "bright black" slot) -- darkened, same warm hue family
red     = '#ff6633'
green   = '#ff9966'
yellow  = '#ffcc99'
blue    = '#ffcc33'
magenta = '#ff9966'
cyan    = '#ffcc99'
white   = '#d9d9d9'
