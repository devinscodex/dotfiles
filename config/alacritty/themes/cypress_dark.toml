# Cypress Dark -- real values from devs-themes/palettes/cypress.json
# (Bonepaper x Everforest blend, already live in Beacon + Fossil Portal).
# bg/button_bg briefly swapped 2026-08-13 with the pre-final archive
# values (devs-themes/palettes/cypress-archive.json, cooler near-black
# #0e1011) then swapped back same day -- Devin tried both live, warm
# dark-brown bg (#17130e) won out. fg/muted_fg(=white) are real sourced
# values, unaffected by anything below.
#
# green/magenta (2026-08-13): the real select_bg/highlight_bg accent
# (#aac98f/#c3e0a8) read as a flashbang when used as a full-line diff-
# highlight background -- softened here (Alacritty-only, per this
# family's standing rule that terminal ANSI colors diverge from the
# canonical devs-themes accent on purpose; devs-themes' own
# select_bg/highlight_bg are UNCHANGED, still #aac98f/#c3e0a8 for
# Beacon/Slate/Fossil Portal). Same hue (H92), lower L/S -- real HSL
# math, not eyeballed.
#
# blue/bright.blue (2026-08-13): was the real external_link violet
# (#c294ca) -- reassigned to a darker forest-green (same H92 family as
# green, but a distinct lightness) so `ls` directory listings (di=01;34,
# bold blue) and Herdr's blue UI lines read as Cypress green instead.
# Deliberately NOT the identical hex as green/magenta -- GNU dircolors'
# default `ow=34;42` (other-writable dir = blue text on green bg) would
# go illegible (green-on-green) if blue and green matched exactly; kept
# distinct enough to still contrast against a green background. The
# real external_link violet no longer appears anywhere in this dark
# variant's 8-color set as a result -- still real in cypress_light.toml
# and devs-themes/palettes/cypress.json itself.

[colors.primary]
background = '#17130e'
foreground = '#dad1bd'

[colors.cursor]
text = '#17130e'
cursor = '#82a960'  # matches softened normal.green below

[colors.normal]
black   = '#17130e'
red     = '#b8624f'  # derived fill, warm terracotta-coral -- same family
                     # as bonepaper_dark's red (#a35648), pushed slightly
                     # toward Everforest's coral-red character.
green   = '#82a960'  # softened from the real accent #aac98f (H92 S35 L67
                     # -> S30 L52) -- less flashbang as a diff/highlight
                     # background, still reads as genuine sage-green.
yellow  = '#b09a4a'  # derived fill, mustard-gold -- same family as
                     # bonepaper_dark's yellow (#a39348).
blue    = '#465d32'  # reassigned from the real external_link violet to a
                     # darker Cypress-green (H92 S30 L28) -- so `ls`
                     # bold-blue directories and Herdr's blue lines read
                     # as Cypress green. Distinct lightness from normal
                     # green on purpose, see header note.
magenta = '#82a960'  # real accent, softened (same value as green above) --
                     # tmux's window-status-current uses colour5 as the
                     # ACTIVE tab bg, near-black text on this accent gives
                     # the same "text glowing on accent" pop bonepaper_dark
                     # and martin_dark both established.
cyan    = '#4f9d88'  # derived fill, jade-teal -- close cousin of
                     # bonepaper_dark's cyan (#48a394), leaning slightly
                     # more Everforest-aqua.
white   = '#828b83'  # real muted_fg value, used directly -- a genuine
                     # sage-gray, another confirmation of the Everforest
                     # lean in this family's real sourced values.

[colors.bright]
black   = '#3a352c'  # bg's own button_bg (#28251f) was only ~17-18/255
                     # off bg -- borderline under the recurring colour8-
                     # gap threshold (bonepaper_dark hit this exact class
                     # of bug and needed TWO widening passes). Widened
                     # straight to a real ~30-35/255 gap along the same
                     # warm dark-olive-brown family.
red     = '#d68a76'
green   = '#9dc379'  # softened from #c3e0a8 (H91 S47 L77 -> S38 L62),
                     # pairs with bright.magenta below, same reuse
                     # pattern as the normal row.
yellow  = '#cdb96c'
blue    = '#60863c'  # reassigned Cypress-green (H91 S38 L38), paired
                     # with normal.blue's reassignment above.
magenta = '#9dc379'  # identical to bright.green, same reuse pattern
                     # bonepaper_dark's own bright row uses.
cyan    = '#71bfa8'
white   = '#dad1bd'  # real fg value.
