# Martin (MEG brand) Light -- real values from devs-themes/palettes/
# martin.json, sourced from martinenergygroup.com's live Elementor
# global palette (presentation/meg-theme.css). green/highlight are the
# theme's own two real MEG greens (primary #62a945, secondary #4a7637);
# red/yellow/blue/cyan below are derived fill (interpolated toward fg
# from bg), not verified brand colors -- this UI palette only defines
# bg/fg/button/accent, not a full 16-slot terminal scheme.

[colors.primary]
background = '#f7f6f2'  # subtle warm off-white, not pure #ffffff --
                        # same hue family as MEG's own button_bg, not a
                        # real brand value on its own (a small softening
                        # step, not a re-source).
foreground = '#1b2224'

[colors.cursor]
text = '#f7f6f2'
cursor = '#56ac35'

[colors.normal]
black   = '#f7f6f2'
red     = '#a6453a'
green   = '#56ac35'  # webUI's real CURRENT martin-light moss-solid
                     # (sat/light re-tuned off the same true MEG hue as
                     # martin.json's #62a945) -- adhering to webUI's
                     # actual live value.
yellow  = '#769e37'  # ~60% shifted toward #56ac35 for more Martin-green
                     # presence; red kept as-is (functional legibility).
blue    = '#499068'  # ~55% shifted toward #56ac35 for more Martin-green
                     # presence -- reads clearly green-teal now, less blue.
magenta = '#4a7637'
cyan    = '#3aa696'
white   = '#535353'

[colors.bright]
black   = '#c7c3b8'  # ~48-58/255 off bg #f7f6f2 for real
                     # active/inactive separation, same warm
                     # off-white/tan hue family.
red     = '#c25a4d'
green   = '#4a7637'
yellow  = '#97a543'
blue    = '#509291'
magenta = '#5a8a44'
cyan    = '#4dc2ae'
white   = '#1b2224'
