# Bonepaper Dark -- real values from devs-themes/palettes/
# bonepaper.json (night-rain, real numpy-sampled sage-mint glow).
# external_link's real violet (#9d8cf0) goes in magenta. red/yellow/cyan
# below are derived fill.

[colors.primary]
background = '#030302'
foreground = '#e8e6e0'

[colors.cursor]
text = '#030302'
cursor = '#b4e4bc'

[colors.normal]
black   = '#030302'
red     = '#a35648'
green   = '#b4e4bc'
yellow  = '#a39348'
blue    = '#9d8cf0'  # external_link's real violet, moved here
magenta = '#b4e4bc'  # real mint accent, not external_link violet -- tmux's
                     # window-status-current uses colour5 as the ACTIVE
                     # tab bg, and near-black text glowing on bright mint
                     # gives the manga "one accent, rest black-and-white
                     # linework" look; violet kept alive in the blue slot
                     # above instead of dropped outright.
cyan    = '#48a394'
white   = '#7d7d78'

[colors.bright]
black   = '#2a3226'  # ~36-47/255 off bg #030302 for real active/inactive
                     # separation, same warm dark-green-black family
                     # (still clearly darker than bonepaper_light's own
                     # tan bg family -- this is the DARK theme's step).
red     = '#c27968'
green   = '#c8ecce'
yellow  = '#c2b168'
blue    = '#b3a5f4'
magenta = '#c8ecce'
cyan    = '#68c2b1'
white   = '#e8e6e0'
