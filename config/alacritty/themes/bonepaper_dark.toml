# Bonepaper Dark -- real values from themes-custom/palettes/
# bonepaper.json (night-rain, real numpy-sampled sage-mint glow).
# external_link's real violet (#9d8cf0) goes in magenta. red/yellow/cyan
# below are derived fill. See Donatello's color-sync notes.

[colors.primary]
background = '#030302'
foreground = '#e8e6e0'

[colors.cursor]
text = '#030302'
cursor = '#b4e4bc'

[colors.normal]
black   = '#030302'
red     = '#a35648'
green   = '#b4e4bc'
yellow  = '#a39348'
blue    = '#4869a3'
magenta = '#9d8cf0'
cyan    = '#48a394'
white   = '#7d7d78'

[colors.bright]
black   = '#1c211a'  # was #07080a (only 4-8/255 lighter than bg #030302 --
                     # same real bug as bonepaper_light's colour8: tmux's
                     # inactive-tab-bg barely differed from the base
                     # background, active/inactive read as not distinct
                     # enough. Reused Runestone's own bonepaper.css
                     # --color-base-30 (#1c211a), a real already-established
                     # "next visible step" tone from this theme's own ramp,
                     # not a new invented value.
red     = '#c27968'
green   = '#c8ecce'
yellow  = '#c2b168'
blue    = '#6889c2'
magenta = '#b3a5f4'
cyan    = '#68c2b1'
white   = '#e8e6e0'
