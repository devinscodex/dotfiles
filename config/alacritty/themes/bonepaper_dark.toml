# Bonepaper Dark -- real values from devs-themes/palettes/
# bonepaper.json (night-rain, real numpy-sampled sage-mint glow).
# external_link's real violet (#9d8cf0) goes in magenta. red/yellow/cyan
# below are derived fill. See Donatello's color-sync notes.

[colors.primary]
background = '#030302'
foreground = '#e8e6e0'

[colors.cursor]
text = '#030302'
cursor = '#b4e4bc'

[colors.normal]
black   = '#030302'
red     = '#a35648'
green   = '#b4e4bc'
yellow  = '#a39348'
blue    = '#9d8cf0'  # external_link's real violet, moved here
magenta = '#b4e4bc'  # was #9d8cf0 (external_link violet) -- tmux's
                     # window-status-current uses colour5 as the ACTIVE
                     # tab bg; Devin asked for "more minty green and dark
                     # manga contrast" there specifically, so the real
                     # mint accent now drives it (near-black text glowing
                     # on bright mint = the manga "one accent, rest
                     # black-and-white linework" look), violet kept alive
                     # in the blue slot above instead of dropped outright.
cyan    = '#48a394'
white   = '#7d7d78'

[colors.bright]
black   = '#2a3226'  # was #1c211a (2026-08-01 first pass, ~26-33/255 off
                     # bg #030302 -- better than the original #07080a but
                     # Devin still wanted more separation). Widened again,
                     # same warm dark-green-black family (still clearly
                     # darker than bonepaper_light's own tan bg family,
                     # this is the DARK theme's step), ~36-47/255 off bg
                     # now.
red     = '#c27968'
green   = '#c8ecce'
yellow  = '#c2b168'
blue    = '#b3a5f4'
magenta = '#c8ecce'
cyan    = '#68c2b1'
white   = '#e8e6e0'
