# Cobalt Dark -- Bluish's own real values (bluish.toml, no light
# counterpart of its own), renamed/repackaged as the dark half of the
# combined Cobalt family (see cobalt_light.toml for the light half,
# Selenized Light). Verbatim from the source theme, no derived fill.
# Matches themes-custom/palettes/cobalt.json's dark.select_bg exactly
# (#547aa2, Bluish's own real cyan) -- built by construction, no drift.

[colors.primary]
background = '#2c3640'
foreground = '#297dd3'

[colors.cursor]
text = '#2c3640'
cursor = '#547aa2'

[colors.normal]
black   = '#2c3640'
red     = '#377fc4'
green   = '#2691e7'
yellow  = '#2090c1'
blue    = '#2c5e87'
magenta = '#436280'
cyan    = '#547aa2'
white   = '#536679'

[colors.bright]
black   = '#23272c'
red     = '#66a5cc'
green   = '#59b0f2'
yellow  = '#4bb0d3'
blue    = '#487092'
magenta = '#50829e'
cyan    = '#658795'
white   = '#4d676b'
