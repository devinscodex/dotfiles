# Bonepaper Light -- real values from themes-custom/palettes/
# bonepaper.json (bone-paper, warm ivory, jade accent). external_link's
# real purple (#5b3fa6) goes in magenta, the theme's own second real
# identity color -- red/yellow/cyan below are derived fill. See
# Donatello's color-sync notes for the convention.

[colors.primary]
background = '#b8a785'
foreground = '#19130d'

[colors.cursor]
text = '#b8a785'
cursor = '#33762d'

[colors.normal]
black   = '#b8a785'
red     = '#8b5843'
green   = '#33762d'
yellow  = '#8b7643'
blue    = '#a3c6e8'  # was #43648b -- real root cause of the folder-
                     # contrast complaint (not colour0/colour8/colour6,
                     # all already fixed): WSL's dircolors renders
                     # other-writable dirs (mode drwxrwxrwx, every
                     # /mnt/c folder) as `ow=34;42` = normal.blue text
                     # ON normal.green bg. #43648b-on-#33762d was two
                     # similarly-dark mid-tones, unreadable. Lightened
                     # to a pale sky-blue for real contrast against the
                     # dark-green fill.
magenta = '#5b3fa6'
cyan    = '#43856b'
white   = '#4e4434'

[colors.bright]
black   = '#8a7a5c'  # was #aa9776 (only 14-16/255 darker than bg #b8a785 -- real
                     # bug, this is tmux's inactive-tab-bg AND the inactive-pane
                     # cwd-label bg, colour0-on-colour8 pairing read as muddy/
                     # near-invisible). Widened the gap to a real, clearly
                     # distinct step while staying in the same warm-tan family.
red     = '#a5715c'
green   = '#4e8a45'
yellow  = '#a5905c'
blue    = '#5c7da5'
magenta = '#7a5cc4'
cyan    = '#5ca38a'
white   = '#19130d'
