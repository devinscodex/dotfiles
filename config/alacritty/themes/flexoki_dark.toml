# Flexoki Dark -- real values from devs-themes/palettes/flexoki.json
# (Steph Ango's published Flexoki, blue-400 accent). Derived-fill
# convention as flexoki_light.toml.

[colors.primary]
background = '#1c1b1a'
foreground = '#e6e4d9'

[colors.cursor]
text = '#1c1b1a'
cursor = '#4385be'

[colors.normal]
black   = '#1c1b1a'
red     = '#a35b4a'
green   = '#6ba34a'
yellow  = '#a3924a'
blue    = '#4385be'
magenta = '#8a4aa3'
cyan    = '#3aa99f'  # real value, not the muted derived-fill -- Kepano's
                     # own published Flexoki cyan-400
                     # (stephango.com/flexoki), same one webUI's dark
                     # accent already uses.
white   = '#6f6e69'

[colors.bright]
black   = '#3a3835'  # ~24-27/255 off bg #1c1b1a for real active/inactive
                     # separation, same warm dark-neutral family.
red     = '#c27a68'
green   = '#8ac268'
yellow  = '#c2b168'
blue    = '#68a3d8'
magenta = '#a968c2'
cyan    = '#5cc9bd'  # brighter real-teal step to match the normal.cyan
                     # value above.
white   = '#e6e4d9'
