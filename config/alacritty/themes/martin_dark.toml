# Martin (MEG brand) Dark -- real values from devs-themes/palettes/
# martin.json (martinenergygroup.com live palette). Same derived-fill
# convention as martin_light.toml -- see that file's header.

[colors.primary]
background = '#1b2224'
foreground = '#cfcfcb'

[colors.cursor]
text = '#1b2224'
cursor = '#62a945'

[colors.normal]
black   = '#1b2224'
red     = '#a6635a'
green   = '#62a945'
yellow  = '#81a34e'  # ~55% shifted toward #62a945 for more Martin-green
                     # presence; red kept as-is (functional legibility).
blue    = '#9fd9c0'  # dircolors folder-contrast fix: WSL renders
                     # other-writable dirs (every /mnt/c folder) as
                     # normal.blue text ON normal.green bg (`ow=34;42`).
                     # A darker mid-tone blue-on-green here is unreadable
                     # (two similarly-dark mid-tones); lightened to a
                     # pale mint-teal for real contrast against the
                     # green fill, reading green-tinted rather than a
                     # cold blue.
magenta = '#62a945'  # primary bright MEG green, not the secondary dark
                     # green -- near-black text on a dark bg is too muddy
                     # for tmux's active tab; the bright accent gives
                     # real "text glowing on accent" contrast instead.
cyan    = '#6fbfa0'  # brightened/greened for more Martin-green presence;
                     # also drives the folder-label color globally
                     # (tmux @pane_active_fg='colour6').
white   = '#7e8180'

[colors.bright]
black   = '#40484f'  # ~37-43/255 off bg #1b2224 for real active/inactive
                     # separation, same cool charcoal family.
red     = '#c28075'
green   = '#4a7637'
yellow  = '#a0b164'
blue    = '#6ea496'
magenta = '#7cc25a'
cyan    = '#8ad4c4'
white   = '#cfcfcb'
