# Custom tmux config file
# Devin Dwight, 2021-22-12
# to reload: bind r (below), or tmux source-file $XDG_CONFIG_HOME/tmux/tmux.conf

# split panes with [ and -
bind [ split-window -h
bind - split-window -v

# swap pane up/down (vi-style)
bind k swap-pane -U
bind j swap-pane -D

# one-key reload, no more typing the source-file path by hand
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# enable mouse support
set -g mouse on

# kill the ~500ms default ESC delay -- matters for vim/nvim mode switches
set -sg escape-time 10

# vi keys in copy-mode (scrollback), matches the vi-style pane binds above
setw -g mode-keys vi

# keep window numbers compact as panes/windows come and go
set -g renumber-windows on

# Real true-color enable -- a literal #rrggbb style color silently
# down-samples to the nearest 256-indexed color without this. Full
# story (why this was needed, the client-negotiation gotcha that made
# it look broken even when set correctly): core/lessons/gotchas.md
# in the cairn project, 2026-07-31 entries.
set -ga terminal-overrides ",*256col*:RGB"

# --- Active/inactive pane colors -- CHANGE THESE, not the style lines below ---
# Full origin story + the real limitations (no per-window theme
# detection, no true tmux transparency, base-16 vs extended-256-cube
# gotchas): core/lessons/gotchas.md, cairn project, 2026-07-31.
#
# SIMPLIFIED 2026-07-31 (Devin: too confusing, revert or use a diff
# color): back to plain 'colour0' as the STABLE DEFAULT -- always
# resolves to whatever theme is actually loaded's own real black, no
# manual re-syncing ever required, no reattach dance, no risk of
# stale/forgotten literal-hex values. Real, accepted tradeoff: under
# ubuntu.toml this shows its plain charcoal (#2e3436), NOT true maroon
# (#300a24) -- that exact color needs a literal hex value that must be
# manually flipped back for every other theme, which is what caused
# tonight's confusion. Use alacritty-theme.sh (dotfiles/bin/) if real
# per-theme maroon is wanted again later -- don't hand-edit this file
# for that, use the script so both sides update together.
set -g @window_active_fg 'default'
set -g @window_active_bg 'colour0'
set -g @window_inactive_fg 'colour7'
set -g @window_inactive_bg 'colour8'
set -g @pane_active_fg '#00ffff'
set -g @pane_active_bg 'colour0'
set -g @pane_inactive_fg 'colour0'
set -g @pane_inactive_bg 'colour8'

# window-style/window-active-style = the PANE'S CONTENT TEXT. `dim` on
# inactive is the real "faded" look -- tmux has no transparency concept
# at all, this is the honest equivalent (genuine SGR faint mode).
set -g window-style "fg=#{@window_inactive_fg},bg=#{@window_inactive_bg},dim"
set -g window-active-style "fg=#{@window_active_fg},bg=#{@window_active_bg}"

# pane-border-style/pane-active-border-style = the BORDER LINE only
# (and the cwd label below, which inherits whichever border style
# applies -- no separate setting needed for that).
set -g pane-border-style "fg=#{@pane_inactive_fg},bg=#{@pane_inactive_bg}"
set -g pane-active-border-style "fg=#{@pane_active_fg},bg=#{@pane_active_bg}"

# Real find, 2026-07-31: THIS is "the active tab" -- the status-bar
# window indicator (bottom bar, e.g. "0:claude*"). Spent a whole night
# thinking window-active-style (the pane's own content area) was the
# target; it wasn't -- turns out window-active-style barely does
# anything visible anyway, since whatever program is running in a pane
# (Claude Code's own interface, in this project's case) paints its own
# background over every cell it writes, and a program's own explicit
# color always wins over tmux's style fallback. The border (drawn by
# tmux directly, no program in the way) and this status-bar tab
# indicator (also drawn by tmux directly) are the two things that
# actually render reliably. Fixed color, not theme-tied on purpose --
# this is a small "which tab is active" accent, not a brand-color
# match, and tonight's whole lesson was that per-theme values are the
# fragile part.
set -g @tab_active_fg 'colour0'
set -g @tab_active_bg 'colour5'
set -g @tab_inactive_fg 'colour7'
set -g @tab_inactive_bg 'colour8'
set -g window-status-current-style "fg=#{@tab_active_fg},bg=#{@tab_active_bg}"
set -g window-status-style "fg=#{@tab_inactive_fg},bg=#{@tab_inactive_bg}"

# Show each pane's cwd on its own border -- distinguishes cairn vs
# cairn-secondary vs cairn-tertiary at a glance (real collision this
# fixed: 2026-07-29, concurrent Slate edits with no way to tell panes
# apart).
set-option -g pane-border-status top
set-option -g pane-border-format " #{pane_current_path} "
