# Custom tmux config file
# Devin Dwight, 2021-22-12
# to reload: bind r (below), or tmux source-file $XDG_CONFIG_HOME/tmux/tmux.conf

# split panes with [ and -
bind [ split-window -h
bind - split-window -v

# swap pane up/down (vi-style)
bind k swap-pane -U
bind j swap-pane -D

# one-key reload, no more typing the source-file path by hand
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# enable mouse support
set -g mouse on

# kill the ~500ms default ESC delay -- matters for vim/nvim mode switches
set -sg escape-time 10

# vi keys in copy-mode (scrollback), matches the vi-style pane binds above
setw -g mode-keys vi

# keep window numbers compact as panes/windows come and go
set -g renumber-windows on

# True-color enable -- a literal #rrggbb style color silently
# down-samples to the nearest 256-indexed color without this.
set -ga terminal-overrides ",*256col*:RGB"

# --- Active/inactive pane colors -- CHANGE THESE, not the style lines below ---
# Plain 'colour0' as the STABLE DEFAULT -- always resolves to whatever
# theme is actually loaded's own real black, no manual re-syncing ever
# required, no reattach dance, no risk of stale/forgotten literal-hex
# values. Accepted tradeoff: under ubuntu.toml this shows its plain
# charcoal (#2e3436), NOT true maroon (#300a24) -- that exact color
# needs a literal hex value that must be manually flipped back for
# every other theme. Use alacritty-theme.sh (dotfiles/bin/) if real
# per-theme maroon is wanted again later -- don't hand-edit this file
# for that, use the script so both sides update together.
set -g @window_active_fg 'default'
set -g @window_active_bg 'colour0'
set -g @window_inactive_fg 'colour7'
set -g @window_inactive_bg 'colour8'
# A hardcoded universal '#00ffff' cyan reads great on every DARK theme
# (cyan pops against near-black) but is genuinely low-contrast on LIGHT
# themes (cyan is itself a bright/light hue, doesn't separate from a
# light bg). Single-pane sessions are ALWAYS "active," so this is the
# color behind the cwd label everyone actually stares at. 'colour6'
# (the cyan ANSI slot) lets each theme's OWN author-chosen cyan carry
# through instead -- light themes conventionally pick a darker/more
# saturated cyan for exactly this readability reason (checked:
# solarized_osaka #2aa198, ubuntu #06989a, gruvbox_dark #689d6a all
# still read fine against near-black too).
set -g @pane_active_fg 'colour6'
set -g @pane_active_bg 'colour0'
set -g @pane_inactive_fg 'colour0'
set -g @pane_inactive_bg 'colour8'

# window-style/window-active-style = the PANE'S CONTENT TEXT. `dim` on
# inactive is the real "faded" look -- tmux has no transparency concept
# at all, this is the honest equivalent (genuine SGR faint mode).
set -g window-style "fg=#{@window_inactive_fg},bg=#{@window_inactive_bg},dim"
set -g window-active-style "fg=#{@window_active_fg},bg=#{@window_active_bg}"

# pane-border-style/pane-active-border-style = the BORDER LINE only
# (and the cwd label below, which inherits whichever border style
# applies -- no separate setting needed for that).
set -g pane-border-style "fg=#{@pane_inactive_fg},bg=#{@pane_inactive_bg}"
set -g pane-active-border-style "fg=#{@pane_active_fg},bg=#{@pane_active_bg}"

# "The active tab" is the status-bar window indicator (bottom bar,
# e.g. "0:claude*"), NOT window-active-style (the pane's own content
# area) -- window-active-style barely does anything visible, since
# whatever program is running in a pane paints its own background over
# every cell it writes, and a program's own explicit color always wins
# over tmux's style fallback. The border (drawn by tmux directly, no
# program in the way) and this status-bar tab indicator (also drawn by
# tmux directly) are the two things that actually render reliably.
# Fixed color, not theme-tied on purpose -- a small "which tab is
# active" accent, not a brand-color match.
set -g @tab_active_fg 'colour0'
set -g @tab_active_bg 'colour5'
set -g @tab_inactive_fg 'colour7'
set -g @tab_inactive_bg 'colour8'
set -g window-status-current-style "fg=#{@tab_active_fg},bg=#{@tab_active_bg}"
# gruvbox_dark's own colour8 (#928374) is objectively much
# lighter/warmer than most other themes' colour8 (Ubuntu #555753,
# Osaka #4c4c4c) -- not a bug, just how that theme's own palette is
# designed. `dim` uniformly tones down perceived brightness regardless
# of which theme's colour8 happens to run light, without needing a
# per-theme override.
set -g window-status-style "fg=#{@tab_inactive_fg},bg=#{@tab_inactive_bg},dim"

# Show each pane's cwd on its own border -- distinguishes multiple
# checkouts of the same project at a glance when running several
# concurrent panes with no other way to tell them apart.
set-option -g pane-border-status top
set-option -g pane-border-format " #{pane_current_path} "
