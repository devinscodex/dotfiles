# Custom tmux config file
# Devin Dwight, 2021-22-12
# to reload: $tmux source-file $XDG_CONFIG_HOME/tmux/tmux.conf

# split panes with [ and -
bind [ split-window -h
bind - split-window -v

# swap pane up/down (vi-style)
bind k swap-pane -U
bind j swap-pane -D

# enable mouse support
set -g mouse on

# Real true-color enable, added 2026-07-31: without this, a literal hex
# color (#rrggbb) in a style string gets silently down-sampled to the
# nearest of the 256-indexed palette instead of rendering exactly --
# confirmed missing here (infocmp showed no Tc/RGB capability). Needed
# below because colour0-15 alone can't reach a theme's REAL identity
# color: Alacritty's [colors.primary].background (Ubuntu's actual
# maroon, #300a24) is a separate value tmux has no indexed slot for at
# all -- colour0 is just the ANSI "black" text color, unrelated to it.
set -ga terminal-overrides ",*256col*:RGB"

#set inactive/active window styles
# Real bug fixed 2026-07-31: these used fixed 256-color-cube indices
# (colour235/236/238/247/250/51), which aren't touched by ANY Alacritty
# theme's [colors.normal]/[colors.bright] tables (those only redefine
# colour0-15). It only looked right under solarized_osaka by
# coincidence -- ubuntu.toml's very different palette (dark plum bg,
# different accent hues) has no relationship to those fixed values.
#
# Second real bug, caught live same session: window-style and
# window-active-style both ended up pointed at the SAME background
# (colour0) -- that erased the active/inactive visual distinction
# entirely, in every theme, not just one. Real fix needs a genuine
# difference between the two, not just theme-awareness.
#
# Devin's ask: make the active-panel color a real VARIABLE, not a
# number buried in the style line. tmux user options (@name) do this
# natively -- style strings support #{@var} interpolation and tmux
# re-evaluates it live, so `tmux set -g @pane_active_fg colourN`
# changes it on the spot with no reload needed. Change the values
# below, not the set -g lines that reference them.
# Devin's own description of the ORIGINAL look, confirmed live: active
# panel was dark teal, inactive panels were gray. That wasn't luck --
# "black" (colour0) IS a dark teal under solarized_osaka (#073642, its
# own real black value), and colour236 (fixed gray) reads as neutral
# gray regardless of theme. Restoring that exact split, base-16 and
# variable-driven this time: active = the theme's own black (whatever
# color that is per-theme), inactive = colour8 (each theme's own
# "bright black" slot, which by near-universal palette convention is a
# desaturated gray even in themes with a colorful colour0 -- Osaka's is
# #4c4c4c, Ubuntu's is #555753, both plain gray).
#
# Real limitation named, not hidden: tmux has no way to ask Alacritty
# which theme is currently loaded, so these variables can't auto-follow
# an Alacritty theme swap -- they're set for whichever theme is active
# NOW (solarized_osaka, Devin's own screenshot confirmed this look).
# Switching Alacritty themes means re-running the matching `tmux set -g`
# block below by hand (or ask for a small helper script that does it in
# one command -- not built yet, flagged rather than assumed away).
#
# CURRENT (solarized_osaka): neon-cyan active border/cwd text (Devin's
# ask, literal hex now that RGB true-color is on -- colour6's real
# value, #2aa198, reads as a muted teal, not neon), teal active
# background (colour0 IS Osaka's own real black, #073642 -- no change
# needed, already correct).
#
# UBUNTU alternative (real values, not yet applied -- swap in when
# actually on that theme): @window_active_bg / @pane_active_bg =
# '#300a24' (Ubuntu's REAL identity color, its terminal background --
# colour0 there is just plain dark charcoal #2e3436, unrelated to it,
# which is the actual root cause of "gray, not maroon"); a fitting
# active fg for that background is Ubuntu's own magenta '#75507b' or
# bright magenta '#ad7fa8', not cyan (cyan doesn't read as an "Ubuntu"
# accent the way maroon/aubergine does).
# Real bug fixed 2026-07-31, caught live: window_active_fg was neon
# cyan too -- that's the ACTIVE PANE'S GENERAL TEXT COLOR (window-active-
# style applies to all content rendered inside the pane), not the
# border. Cyan belongs ONLY on @pane_active_fg (the border, and the cwd
# path text at top since pane-border-format inherits the border
# style's color automatically -- no separate setting needed for that).
# Regular pane text should stay whatever the running program (shell,
# Claude Code) already renders -- 'default' means exactly that, not a
# specific color, so it never fights with a program's own colors.
# CURRENT (2026-07-31, Devin's explicit ask -- ubuntu.toml active):
# literal maroon (#300a24, Ubuntu's real [colors.primary].background)
# for active bg -- was 'colour0' for solarized_osaka, which IS correct
# under Osaka (its own real black) but only ever coincidentally so.
# Real, confirmed tradeoff (found live 2026-07-31 -- all 3 checkout
# panes are ONE shared tmux session, not separate ones; a literal hex
# is a single global value, so it applies to whichever pane is active
# REGARDLESS of which theme that specific Alacritty window is running):
# switching back to testing Osaka needs this manually reverted to
# 'colour0' (or built into a real per-window scoping mechanism -- not
# done, see gotchas.md). Whichever theme is NOT active right now will
# render its active pane in THIS color, not its own.
set -g @window_active_fg 'default'
set -g @window_active_bg '#300a24'
set -g @window_inactive_fg 'colour7'
set -g @window_inactive_bg 'colour8'
set -g @pane_active_fg '#00ffff'
set -g @pane_active_bg '#300a24'
# Real bug fixed 2026-07-31, caught live: fg and bg were BOTH colour8 --
# the border line was being drawn in the exact same color as its own
# background, so the seam between two adjacent inactive panes vanished
# entirely. Needs two DIFFERENT values, same as the original design
# (colour235 fg vs colour238 bg -- close but not identical, a subtle
# but real line). Base-16 equivalent: colour0 (each theme's real black)
# vs colour8 (each theme's own "bright black" slot, which by palette
# convention always reads a bit lighter than colour0) -- same subtle
# contrast, theme-aware this time.
set -g @pane_inactive_fg 'colour0'
set -g @pane_inactive_bg 'colour8'

# Real answer, not assumed: tmux has NO transparency/alpha concept at
# all -- every cell is one opaque color, there's no "blend with what's
# behind it" the way a GUI compositor works (Alacritty's own window
# opacity is whole-WINDOW, uniform, unrelated to individual tmux panes
# inside it). `dim` is the real, honest equivalent for "faded" --
# genuine SGR faint mode, most terminals render it as reduced
# intensity on the foreground text specifically (Devin's ask,
# 2026-07-31: "fade the inactive tmux tabs a smidge").
set -g window-style "fg=#{@window_inactive_fg},bg=#{@window_inactive_bg},dim"
set -g window-active-style "fg=#{@window_active_fg},bg=#{@window_active_bg}"

# set the pane border colors
set -g pane-border-style "fg=#{@pane_inactive_fg},bg=#{@pane_inactive_bg}"
set -g pane-active-border-style "fg=#{@pane_active_fg},bg=#{@pane_active_bg}"

# Show each pane's current working directory on its own border -- real gap
# found live 2026-07-29: Devin ran Slate work in both primary and secondary
# Cairn checkouts concurrently with no way to tell the panes apart at a
# glance, leading to a real (harmless, merged clean) fossil concurrent-edit
# collision. cwd is the one thing that reliably distinguishes cairn vs
# cairn-secondary vs cairn-tertiary panes.
set-option -g pane-border-status top
set-option -g pane-border-format " #{pane_current_path} "
